[project]
name = "campus-notification-assistant"
version = "0.1.0"
description = "校园通知的原文核对与确认保存"
requires-python = ">=3.12,<3.14"
dependencies = [
  "PySide6>=6.8,<7",
  "httpx>=0.28,<0.29",
  "pydantic>=2.10,<3",
  "keyring>=25,<26",
]

[project.scripts]
campus-notifications = "campus_notification_assistant.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "mypy>=1.15,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
